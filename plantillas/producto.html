<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}} · {{NOMBRE}}</title>
<meta name="description" content="{{DESCRIPCION}}">
<link rel="canonical" href="{{URL}}">
<meta property="og:type" content="product">
<meta property="og:title" content="{{TITULO}}">
<meta property="og:description" content="{{DESCRIPCION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{IMAGEN_URL}}">
<meta property="product:brand" content="{{MARCA}}">
<meta property="product:availability" content="in stock">
<meta property="product:condition" content="new">
<meta property="product:price:amount" content="{{PRECIO_NUM}}">
<meta property="product:price:currency" content="MXN">
<meta property="product:retailer_item_id" content="{{URL}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1b19'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23d9b77e' text-anchor='middle'%3ELP%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#f7f5f2; --ink:#1d1b19; --muted:#6f6a64; --line:#e4dfd8; --accent:#8a6a3b; --wa:#1f9d55; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--ink); }
  .top { background:var(--ink); color:#fff; }
  .top-in { max-width:1040px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  .logo { font-family:Georgia, "Times New Roman", serif; font-size:24px; color:#fff; text-decoration:none; }
  .logo span { color:#d9b77e; font-style:italic; }
  .back { color:var(--muted); font-size:14px; text-decoration:none; display:inline-block; margin:22px 0 14px; }
  .back:hover { color:var(--ink); }
  .wrap { max-width:1040px; margin:0 auto; padding:0 24px 50px; }
  .prod { display:grid; grid-template-columns:1fr 1fr; gap:36px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px; }
  .photo { aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
  .photo img { max-width:100%; max-height:100%; object-fit:contain; }
  .det { display:flex; flex-direction:column; justify-content:center; gap:10px; }
  .brand { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
  h1 { font-family:Georgia, "Times New Roman", serif; font-weight:normal; font-size:30px; line-height:1.2; margin:0; }
  .sec { color:var(--muted); font-size:14px; }
  .price { font-size:30px; font-weight:600; margin:10px 0 4px; font-variant-numeric:tabular-nums; }
  .avail { color:var(--wa); font-size:14px; font-weight:600; }
  .wa-btn { margin-top:16px; display:inline-flex; align-items:center; justify-content:center; gap:10px; background:var(--wa); color:#fff; text-decoration:none; padding:14px 22px; border-radius:999px; font-size:16px; font-weight:600; }
  .wa-btn svg { width:22px; height:22px; fill:currentColor; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 24px 40px; }
  @media (max-width:720px) {
    .prod { grid-template-columns:1fr; gap:18px; padding:18px; }
    h1 { font-size:24px; }
    .wrap { padding:0 14px 40px; }
  }
</style>
</head>
<body>
<div class="top"><div class="top-in"><a class="logo" href="../">La <span>Perfumisa</span></a></div></div>
<div class="wrap">
  <a class="back" href="../">← Ver todo el catálogo</a>
  <div class="prod">
    <div class="photo"><img src="{{IMAGEN}}" alt="{{TITULO}}"></div>
    <div class="det">
      <div class="brand">{{MARCA}}</div>
      <h1>{{TITULO}}</h1>
      <div class="sec">Perfume para {{SECCION}}</div>
      <div class="price">{{PRECIO}} <span style="font-size:14px;font-weight:normal;color:var(--muted)">MXN</span></div>
      <div class="avail">● Disponible</div>
      <a class="wa-btn" href="{{WHATSAPP_PEDIDO}}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3.9 2.5c.1.2 1.6 2.5 4 3.5 1.5.6 2 .7 2.8.6.4-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>Pedir por WhatsApp</a>
      <div class="note">Precio actualizado el {{FECHA}}. Sujeto a cambio sin previo aviso.</div>
    </div>
  </div>
</div>
<footer>{{NOMBRE}} · <a href="{{WHATSAPP}}" target="_blank" rel="noopener">WhatsApp</a></footer>
</body>
</html>
