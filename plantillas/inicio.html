<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NOMBRE}} · Catálogo de perfumes</title>
<meta name="description" content="Catálogo de perfumes para dama y caballero de {{NOMBRE}}. Pide por WhatsApp.">
<meta property="og:title" content="{{NOMBRE}} · Catálogo de perfumes">
<meta property="og:description" content="Perfumes para dama y caballero. Pide por WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:url" content="{{BASE_URL}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1b19'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23d9b77e' text-anchor='middle'%3ELP%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#f7f5f2; --card:#fff; --ink:#1d1b19; --muted:#6f6a64; --line:#e4dfd8; --accent:#8a6a3b; --wa:#1f9d55; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--ink); }
  a { color:inherit; }
  .top { background:var(--ink); color:#fff; }
  .top-in { max-width:1240px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .logo { font-family:Georgia, "Times New Roman", serif; font-size:24px; letter-spacing:.02em; text-decoration:none; }
  .logo span { color:#d9b77e; font-style:italic; }
  .wa-btn { display:inline-flex; align-items:center; gap:8px; background:var(--wa); color:#fff; text-decoration:none; padding:9px 16px; border-radius:999px; font-size:14px; font-weight:600; white-space:nowrap; }
  .wa-btn svg { width:18px; height:18px; fill:currentColor; }
  header { padding:28px 24px 10px; max-width:1240px; margin:0 auto; }
  h1 { font-family:Georgia, "Times New Roman", serif; font-weight:normal; font-size:32px; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; }
  .bar { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); }
  .tabs { max-width:1240px; margin:0 auto; padding:10px 24px 0; display:flex; gap:6px; flex-wrap:wrap; }
  .controls { max-width:1240px; margin:0 auto; padding:10px 24px 12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input, select, button { font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  input[type=search] { flex:1 1 220px; }
  button { cursor:pointer; }
  .tab { border-radius:999px; padding:7px 18px; }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .count { color:var(--muted); font-size:13px; margin-left:auto; }
  main { max-width:1240px; margin:0 auto; padding:20px 24px 50px; display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; text-decoration:none; transition:box-shadow .15s, transform .15s; }
  .card:hover { box-shadow:0 6px 20px rgba(0,0,0,.08); transform:translateY(-2px); }
  .img { aspect-ratio:1; background:#fff; display:flex; align-items:center; justify-content:center; padding:12px; }
  .img img { max-width:100%; max-height:100%; object-fit:contain; }
  .noimg { color:var(--muted); font-size:12px; }
  .info { padding:12px 14px 14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px; flex:1; }
  .brand { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  .g { color:var(--muted); }
  .name { font-size:14px; line-height:1.35; flex:1; }
  .price { font-size:17px; font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums; }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:40px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 24px 40px; line-height:1.7; }
  .float { position:fixed; right:18px; bottom:18px; z-index:10; box-shadow:0 6px 18px rgba(0,0,0,.2); }
  @media (max-width:600px) {
    main { grid-template-columns:repeat(2,1fr); gap:10px; padding:14px; }
    header, .tabs, .controls { padding-left:14px; padding-right:14px; }
    h1 { font-size:26px; }
    .top-in .wa-btn .txt { display:none; }
    .count { margin-left:0; }
  }
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <a class="logo" href="./">La <span>Perfumisa</span></a>
  <a class="wa-btn" href="{{WHATSAPP}}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3.9 2.5c.1.2 1.6 2.5 4 3.5 1.5.6 2 .7 2.8.6.4-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg><span class="txt">Pedir por WhatsApp</span></a>
</div></div>
<header>
  <h1 id="h1">Catálogo de perfumes</h1>
  <div class="sub" id="sub"></div>
</header>
<div class="bar">
  <div class="tabs" id="tabs"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Buscar perfume o marca…">
    <select id="brand"><option value="">Todas las marcas</option></select>
    <select id="sort">
      <option value="az">Nombre A–Z</option>
      <option value="pa">Precio: menor a mayor</option>
      <option value="pd">Precio: mayor a menor</option>
      <option value="brand">Marca</option>
    </select>
    <span class="count" id="count"></span>
  </div>
</div>
<main id="grid"></main>
<footer>
  Precios y disponibilidad actualizados el {{FECHA}}. Sujetos a cambio sin previo aviso.<br>
  ¿Dudas o pedidos? <a href="{{WHATSAPP}}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>.
</footer>
<script>
const DATA = {{DATOS}};
const LABEL = {{ETIQUETAS}};
const fmt = n => "$" + n.toLocaleString("es-MX", {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sel = document.getElementById("brand");
let cur = DATA, tab = "todos";
const tabs = [["todos","Todos"], ...Object.keys(LABEL).sort().map(k => [k, LABEL[k]])];
document.getElementById("tabs").innerHTML = tabs.map(([k,l]) => `<button class="tab" data-k="${k}">${esc(l)}</button>`).join("");
function setTab(k, keepUrl) {
  tab = k;
  cur = k === "todos" ? DATA : DATA.filter(d => d.g === k);
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.k === k));
  document.getElementById("h1").textContent = k === "todos" ? "Catálogo de perfumes" : `Perfumes para ${LABEL[k].toLowerCase()}`;
  const brands = [...new Set(cur.map(d => d.b))].sort((a,b)=>a.localeCompare(b,"es"));
  const prev = sel.value; sel.length = 1;
  brands.forEach(b => sel.add(new Option(`${b} (${cur.filter(d=>d.b===b).length})`, b)));
  sel.value = brands.includes(prev) ? prev : "";
  document.getElementById("sub").textContent = `${cur.length} perfumes · ${brands.length} marcas · precios en pesos mexicanos`;
  if (!keepUrl) history.replaceState(null, "", k === "todos" ? location.pathname : "#" + k);
  render();
}
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const b = sel.value, s = document.getElementById("sort").value;
  const list = cur.filter(d => (!b || d.b === b) && (!q || (d.t + " " + d.b).toLowerCase().includes(q)));
  list.sort({ az:(x,y)=>x.t.localeCompare(y.t,"es"), pa:(x,y)=>x.p-y.p, pd:(x,y)=>y.p-x.p, brand:(x,y)=>x.b.localeCompare(y.b,"es")||x.t.localeCompare(y.t,"es") }[s]);
  document.getElementById("count").textContent = `${list.length} resultado${list.length===1?"":"s"}`;
  document.getElementById("grid").innerHTML = list.length ? list.map(d => `
    <a class="card" href="producto/${encodeURIComponent(d.h)}.html">
      <div class="img">${d.i ? `<img loading="lazy" src="img/${encodeURIComponent(d.h)}.jpg" alt="${esc(d.t)}">` : `<span class="noimg">Sin foto</span>`}</div>
      <div class="info">
        <div class="brand">${esc(d.b)} <span class="g">· ${esc(LABEL[d.g])}</span></div>
        <div class="name">${esc(d.t)}</div>
        <div class="price">${fmt(d.p)}</div>
      </div>
    </a>`).join("") : `<div class="empty">No hay perfumes que coincidan.</div>`;
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setTab(t.dataset.k)));
["q","sort"].forEach(id => document.getElementById(id).addEventListener("input", render));
sel.addEventListener("change", render);
const start = location.hash.slice(1);
setTab(LABEL[start] ? start : "todos", true);
</script>
<a class="wa-btn float" href="{{WHATSAPP}}" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3.9 2.5c.1.2 1.6 2.5 4 3.5 1.5.6 2 .7 2.8.6.4-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg></a>
</body>
</html>
